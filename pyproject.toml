[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssl-expiry-radar"
version = "1.0.0"
description = "Automated SSL/TLS Certificate Scanner and Expiration Predictor"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Afzalbek", email = "afzalbek.dev@gmail.com"}]
dependencies = []

[project.scripts]
ssl-radar = "ssl_radar.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
